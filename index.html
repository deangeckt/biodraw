<!DOCTYPE html>
<!--
  Repository-root redirect into the gallery.

  GitHub Pages has to publish this project from the repository ROOT rather
  than from `site/`, because every gallery page references its drawings as
  `../examples/<slug>/<file>` instead of carrying its own copy of them — the
  seven example folders come to about 1.9 MB, and the image weight budget in
  docs/RULES.md is explicit that they are not duplicated.

  Publishing from the root means the gallery is served at `/biodraw/site/`,
  which is not the URL anyone would type. This file is the three lines that
  make `/biodraw/` land in the right place. It is not generated by
  tools/build_site.py: that script owns everything under site/, and this is
  the one page that has to live outside it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>biodraw</title>
  <meta http-equiv="refresh" content="0; url=./site/index.html">
  <link rel="canonical" href="./site/index.html">
</head>
<body>
  <p>Redirecting to the <a href="./site/index.html">biodraw gallery</a>.</p>
</body>
</html>
